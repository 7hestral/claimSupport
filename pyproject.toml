[project]
name = "insurance-sop"
version = "0.1.0"
description = "Insurance claims SOP harness with LangGraph and OpenRouter"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1,<2",
    "langchain-openrouter>=0.1,<1",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "streamlit>=1.45,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]
